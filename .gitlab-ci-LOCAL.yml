# Шаблон для GitLab CI с локальной настройкой Allure TestOps
# Скопируйте этот файл в .gitlab-ci.yml и заполните переменные

stages:
  - test
  - report
  - deploy-report

variables:
  # Заполните эти переменные в GitLab CI/CD (Настройки > CI/CD > Переменные)
  # CLIENT: "https://your-api-endpoint.com/api/v1/"
  # ALLURE_TOKEN: "your-allure-testops-token"
  # ALLURE_PROJECT_ID: "your-project-id"
  # ALLURE_TESTOPS_ENDPOINT: "https://your-allure-instance.com"

  ALLURE_RESULTS_DIRECTORY: "$CI_PROJECT_DIR/allure-results"
  ALLURE_REPORT_DIRECTORY: "$CI_PROJECT_DIR/allure-report"

run-tests:
  image: python:3.11-slim
  stage: test
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest --order-dependencies --alluredir=$ALLURE_RESULTS_DIRECTORY -v
  artifacts:
    paths:
      - allure-results/
    expire_in: 1 week

generate-report:
  stage: report
  image: frankescobar/allure-docker-service:latest
  dependencies:
    - run-tests
  script:
    - allure generate $ALLURE_RESULTS_DIRECTORY -o $ALLURE_REPORT_DIRECTORY --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 1 week

